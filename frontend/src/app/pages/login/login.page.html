<ion-content class="login-content">
  <div class="login-wrapper">

    <div class="login-top">
      <div class="logo-ring">
        <div class="logo-circle">♪</div>
      </div>
      <h1>SoundDiary</h1>
      <p>Seu diário musical pessoal</p>
    </div>

    <div class="login-form">
      <div class="input-group">
        <span class="input-icon">✉</span>
        <ion-input type="email" [(ngModel)]="email"
          placeholder="seu@email.com"
          class="custom-input">
        </ion-input>
      </div>

      <div class="input-group">
        <span class="input-icon">🔒</span>
        <ion-input type="password" [(ngModel)]="senha"
          placeholder="Sua senha"
          class="custom-input">
        </ion-input>
      </div>

      <ion-button expand="block" class="btn-entrar" (click)="login()">
        ENTRAR
      </ion-button>

      <div class="divider">
        <span></span>
        <p>ou</p>
        <span></span>
      </div>

      <ion-button expand="block" fill="outline" class="btn-cadastro" routerLink="/cadastro">
        CRIAR CONTA
      </ion-button>
    </div>

    <p class="footer-text">Registre suas músicas favoritas ♪</p>

  </div>
</ion-content>
